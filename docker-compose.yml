services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    # No auth token, and no host code mount: MiniStack runs Node.js Lambdas in
    # warm worker pools inside its own process, so there is nothing to bind-mount.
    # The Docker socket is only needed for container-backed services (RDS, ECS,
    # provided.* runtimes) — not for this nodejs20.x function.
