services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - DEBUG=0
      # Floci ships the "hot-reload" magic bucket but, unlike LocalStack, it is
      # OFF by default — CreateFunction fails without this. Required for hot-reload.
      # Docs: https://floci.io/floci/configuration/environment-variables/
      - FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED=true
    volumes:
      # Lambda runs in real Docker containers, so Floci needs the host Docker socket.
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Floci spawns a child container per Lambda invoke and mounts this
      # path from the HOST directly. Both sides must be the same absolute path.
      # Set HOST_DIST_PATH before `docker compose up`:
      #   export HOST_DIST_PATH="$(pwd)/dist"
      - "${HOST_DIST_PATH}:${HOST_DIST_PATH}"
